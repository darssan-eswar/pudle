name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Vercel app dependencies
        run: npm ci --prefix deploy/vercel

      - name: Vercel app tests
        run: npm test --prefix deploy/vercel

      - name: Vercel app TypeScript
        run: npm run typecheck --prefix deploy/vercel

      - name: Vercel app build
        run: npm run build --prefix deploy/vercel

      - name: Convoy database access rules
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -d --name pudle-ci-postgres -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine
          trap 'docker stop pudle-ci-postgres >/dev/null' EXIT
          for attempt in {1..30}; do
            if docker exec pudle-ci-postgres pg_isready -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec pudle-ci-postgres mkdir -p /tmp/pudle/migrations /tmp/pudle/tests
          docker cp supabase/migrations/202609250001_convoy_obstacles.sql pudle-ci-postgres:/tmp/pudle/migrations/202609250001_convoy_obstacles.sql
          docker cp supabase/tests/convoy_rls.psql pudle-ci-postgres:/tmp/pudle/tests/convoy_rls.psql
          docker exec pudle-ci-postgres psql -U postgres -d postgres -f /tmp/pudle/tests/convoy_rls.psql
