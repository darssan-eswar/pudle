# XcodeGen spec. Generate the project with:  cd apps/mobile/ios && xcodegen generate
# Signing values come from the ignored Config/Local.xcconfig (see Config/Local.example.xcconfig).
name: Pudle
options:
  bundleIdPrefix: app.pudle
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  PudleCore:
    path: PudleCore
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
targets:
  Pudle:
    type: application
    platform: iOS
    sources:
      - path: Pudle
    dependencies:
      - package: PudleCore
    info:
      path: Pudle/Info.plist
      properties:
        CFBundleDisplayName: Pudle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [location-services]
        UIBackgroundModes: [location, audio]
        NSLocationWhenInUseUsageDescription: >-
          During a drive you start, Pudle uses your location on this iPhone to decide whether a reported
          road hazard is on your heading. Your movement is not uploaded. Location stops when you stop the drive.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          Pudle only uses location during a drive you start. "While Using" is enough; Pudle does not need
          "Always" access.
        NSCameraUsageDescription: >-
          Dashcam mode sends a small picture from the rear camera about once a second to Pudle's hazard checker
          (Google Gemini) while a drive is active. Pictures are not saved. Nothing is shared until you confirm a report.
        NSMicrophoneUsageDescription: >-
          After Pudle asks whether to report a hazard, it listens for a few seconds for "report it" or "cancel".
        NSSpeechRecognitionUsageDescription: >-
          Pudle turns your short spoken answer ("report it" / "cancel") into text, on this iPhone when supported.
        LSApplicationQueriesSchemes: [comgooglemaps]
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        PudleSupabaseURL: $(PUDLE_SUPABASE_URL)
        PudleSupabaseKey: $(PUDLE_SUPABASE_PUBLISHABLE_KEY)
        PudleBuildCommit: $(PUDLE_BUILD_COMMIT)
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
# Core logic tests run with `swift test` inside PudleCore/ (see apps/mobile/ios/README.md).
schemes:
  Pudle:
    build:
      targets:
        Pudle: all
